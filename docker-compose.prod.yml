


services:

  traefik:
    image: traefik:v2.11

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      

      - ./docker/traefik/acme.json:/letsencrypt/acme.json

    networks:
      - public

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
      
   
    networks:
      - private

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile

    restart: unless-stopped
    labels:
      - traefik.enable=false

    
    
    

    networks:
      - private

  

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

   

    

    depends_on:
     - postgres
     - redis
        
    
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -H 'Host: campaingnflow.com' -H 'X-Forwarded-Proto: https' http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
      

    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    
   

    networks:
      - public
      - private

    labels:
      - traefik.enable=true
      - traefik.docker.network=whatsapp_sender_public
      - traefik.http.routers.backend.rule=Host(`campaingnflow.com`) && (PathPrefix(`/api`) || PathPrefix(`/admin`))
      - traefik.http.routers.backend.priority=100

      - traefik.http.routers.backend.entrypoints=https

      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=letsencrypt

      - traefik.http.services.backend.loadbalancer.server.port=8000
      - traefik.http.middlewares.backend-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.backend.middlewares=backend-headers
  celery:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

    

    depends_on:
     - postgres
     - redis
    labels:
      - traefik.enable=false

    

    networks:
      - private
      - public

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

      args:
        VITE_API_URL: /api

    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - public

    labels:
      - traefik.enable=true

     
      - traefik.http.routers.frontend.rule=(Host(`campaingnflow.com`) || Host(`www.campaingnflow.com`)) && !PathPrefix(`/api`)

      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.entrypoints=http,https

      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt

      - traefik.http.services.frontend.loadbalancer.server.port=80
    
    

  
  
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

    

    depends_on:
     - postgres
        
    labels:
      - traefik.enable=false
    networks:
      - private



volumes:

  postgres_data:

  media_data:

  static_data:

  letsencrypt:

  flower_data:

networks:

  public:
    name: whatsapp_sender_public

  private:
    name: whatsapp_sender_private
