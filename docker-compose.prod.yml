version: "3.9"

x-django-env: &django-env
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: config.settings

  SECRET_KEY: ${SECRET_KEY}

  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}

  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}

  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
  TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}

services:

  traefik:
    build:
      context: .
      dockerfile: docker/traefik/Dockerfile

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

    networks:
      - public

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - private

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile

    restart: unless-stopped

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - private

  migrate:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    restart: "no"

    env_file:
      - .env.prod

    environment:
      <<: *django-env

    command: >
      python manage.py migrate

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - private

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      <<: *django-env

    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      "

    depends_on:
      migrate:
        condition: service_completed_successfully

    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

    networks:
      - public
      - private

    labels:
      - traefik.enable=true
      - traefik.docker.network=whatsapp_sender_public

      - traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/admin`)
      - traefik.http.routers.backend.entrypoints=web

      - traefik.http.services.backend.loadbalancer.server.port=8000

  celery:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile

    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      <<: *django-env

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - private

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile

      args:
        VITE_API_URL: /api

    restart: unless-stopped

    depends_on:
      - backend

    networks:
      - public

    labels:
      - traefik.enable=true
      - traefik.docker.network=whatsapp_sender_public

      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web

      - traefik.http.services.frontend.loadbalancer.server.port=80

volumes:

  postgres_data:

  media_data:

  static_data:

  letsencrypt:

networks:

  public:
    name: whatsapp_sender_public

  private:
    name: whatsapp_sender_private